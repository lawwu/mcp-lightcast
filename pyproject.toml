[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-lightcast"
version = "0.4.0"
# dynamic = ["version"]  # Disabled in favor of static version
description = "MCP server for Lightcast API integration using FastMCP"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lawrence Wu"}
]
maintainers = [
    {name = "Lawrence Wu"}
]
keywords = ["mcp", "lightcast", "skills", "job-titles", "api", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "fastmcp>=4.1.8,<5",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
]
requires-python = ">=3.14"

[project.urls]
Homepage = "https://github.com/lawwu/mcp-lightcast"
Repository = "https://github.com/lawwu/mcp-lightcast"
Issues = "https://github.com/lawwu/mcp-lightcast/issues"
Documentation = "https://lawwu.github.io/mcp-lightcast/"
Changelog = "https://github.com/lawwu/mcp-lightcast/releases"

[dependency-groups]
docs = [
    "zensical>=0.1.1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0", 
    "pytest-httpx>=0.21.0",
    "pytest-cov",
    "black",
    "ruff", 
    "mypy",
    "pre-commit",
    "twine",
    "build",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.21.0", 
    "pytest-cov",
]

[project.scripts]
mcp-lightcast = "mcp_lightcast:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--asyncio-mode=auto"
markers = [
    "live: opt-in tests against the actual Lightcast API",
    "proxy: opt-in local Docker/nginx integration tests (no live Lightcast access)",
]

[tool.black]
line-length = 88
target-version = ['py314']

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]  # Line too long

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

# Static versioning - version is set in [project] section above

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lightcast"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/docs", "/examples", "/config",
    "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/mkdocs.yml",
    "/.env.example", "/Dockerfile", "/Dockerfile.dev", "/docker-compose.yml",
    "/run_server.py", "/scripts/docs.py",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report] 
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
