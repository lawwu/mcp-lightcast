site_name: MCP Lightcast
site_description: Labor-market intelligence, connected to your AI tools. A practical guide to the Lightcast MCP server.
site_url: https://lawwu.github.io/mcp-lightcast/
repo_url: https://github.com/lawwu/mcp-lightcast
repo_name: lawwu/mcp-lightcast
edit_uri: edit/main/docs/
strict: true
copyright: Independent open-source integration · MIT licensed · Not affiliated with Lightcast
nav:
  - Overview: index.md
  - Start here:
      - Quick start: getting-started.md
      - Configuration: configuration.md
      - Credential providers: credentials.md
      - Choosing a tool: tool-guide.md
  - Guides:
      - Recipes: recipes.md
      - Core LMI examples: core-lmi.md
      - Testing: testing.md
      - Deployment: deployment.md
  - Reference:
      - MCP tools: reference/tools.md
      - Architecture: architecture.md
      - API compatibility review: review.md
      - MCP practices: mcp-review.md
      - Migration to 0.3: migration.md
      - Release 0.4.1: releases/0.4.1.md
      - Release 0.4.0: releases/0.4.0.md
      - Release 0.3.1: releases/0.3.1.md
      - Release 0.3.0: releases/0.3.0.md
theme:
  variant: classic
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lawwu/mcp-lightcast
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
