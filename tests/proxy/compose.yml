# Isolated local integration stack. No real credentials or external API access.
services:
  lightcast-fixture:
    image: mcp-lightcast:test
    entrypoint: ["python", "/fixture/lightcast.py"]
    volumes:
      - ./lightcast.py:/fixture/lightcast.py:ro

  server: &server
    image: mcp-lightcast:test
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "3000", "--quiet"]
    environment: &server_environment
      LIGHTCAST_CLIENT_ID: proxy-test-client
      LIGHTCAST_CLIENT_SECRET: proxy-test-secret
      LIGHTCAST_OAUTH_URL: http://lightcast-fixture:8000/token
      LIGHTCAST_CORE_LMI_URL: http://lightcast-fixture:8000
      FASTMCP_HTTP_ALLOWED_HOSTS: '["mcp.test"]'
      FASTMCP_HTTP_ALLOWED_ORIGINS: '["https://client.test", "https://mcp.test"]'
      FASTMCP_MCP_CAMELCASE_COMPAT: "false"
    depends_on:
      - lightcast-fixture

  header-server:
    <<: *server
    environment:
      <<: *server_environment
      LIGHTCAST_CREDENTIAL_MODE: headers
      LIGHTCAST_CORE_LMI_REQUESTS_PER_SECOND: "100"

  proxy:
    image: nginx:1.30.6-alpine
    networks: [default, edge]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PROXY_TLS_DIR:?Set the temporary certificate directory}:/etc/nginx/tls:ro
    ports:
      - target: 8443
        published: "0"
        host_ip: 127.0.0.1
    depends_on:
      - server
      - header-server

networks:
  default:
    internal: true
  edge: {}
