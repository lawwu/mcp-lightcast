name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  FASTMCP_MCP_CAMELCASE_COMPAT: "false"
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14', '3.15']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
          version: '0.13.7'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest --cov=src --cov-report=term-missing
      - run: uv build
      - run: uv run --frozen twine check dist/*
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t mcp-lightcast:test .
      - run: docker run --rm mcp-lightcast:test --help
