# Checks the GitHub Actions setup itself on every pull request.
# - "Actions lock": every action used is in .github/workflows/actions.lock and each locked
#   commit still matches upstream (catches a moved tag or a missing lock entry).
#   After changing a workflow, relock with `gh actions-lock` and commit the lockfile.
# - "zizmor": lints the workflows (unpinned actions, broad token permissions, credentials
#   left on disk, template injection, known-vulnerable actions, impostor commits).
#   Run locally with `uvx zizmor .github/`.
name: actions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    name: Actions lock
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: 1.32.0
          # findings fail the job, as annotations on the pull request
          advanced-security: false
          annotations: true
