name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.7"
        enable-cache: false

    - name: Install dependencies
      run: uv sync --all-groups --frozen

    - name: Verify release version
      env:
        RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      run: |
        uv run python -c 'import os, tomllib; expected = os.environ["RELEASE_VERSION"].removeprefix("v"); actual = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert actual == expected, (actual, expected)'

    - name: Build documentation
      run: uv run --group docs python scripts/docs.py build --strict

    - name: Run tests
      run: uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      env:
        # Mock environment variables for testing
        LIGHTCAST_CLIENT_ID: "test_client_id"
        LIGHTCAST_CLIENT_SECRET: "test_client_secret"

    - name: Run linting
      run: |
        uv run ruff check src/ tests/
        uv run ruff format --check src/ tests/

    - name: Run type checking
      run: uv run mypy src/

    - name: Build package
      run: uv build

    - name: Check distribution
      run: |
        uv run twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.2
      with:
        name: dist
        path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-lightcast
    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8.0.2
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        attestations: true

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mcp-lightcast
    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8.0.2
      with:
        name: dist
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        attestations: true

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8.0.2
      with:
        name: dist
        path: dist/

    - name: Extract version from tag
      id: version
      run: printf 'version=%s\n' "${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    - name: Create release with generated notes
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.whl \
            --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.whl \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "MCP Lightcast v$RELEASE_VERSION" --prerelease=false
        fi
