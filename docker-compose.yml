services:
  mcp-lightcast:
    build:
      context: .
      target: production
    env_file: .env
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  mcp-lightcast-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    stdin_open: true
    profiles: [dev]
